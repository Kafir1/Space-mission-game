<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Испытательный полёт</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05070f;
  --panel: rgba(16, 24, 46, 0.86);
  --panel-2: rgba(26, 38, 70, 0.9);
  --line: rgba(130, 160, 230, 0.22);
  --text: #e6ecfa;
  --muted: #93a2c4;
  --accent: #4ea3ff;
  --accent-2: #7cf0d0;
  --warn: #ffb547;
  --bad: #ff5d6c;
  --good: #4fe08a;
  --gold: #ffd25a;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(ellipse at 20% 0%, #13224a 0%, #070b18 55%, var(--bg) 100%) fixed;
  color: var(--text);
  font-family: 'Exo 2', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 20px 16px 60px; }
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.2; }
h2 { font-size: 1.7rem; }
h4 { font-size: 1.05rem; color: var(--accent-2); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.center { justify-content: center; }
.gap { gap: 14px; }
.screen { animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin: 14px 0; backdrop-filter: blur(4px); }
.badge { display: inline-block; background: var(--accent); color: #031021; font-weight: 800; font-size: .75rem; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; }

.btn {
  font: inherit; font-weight: 600; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 16px; cursor: pointer; transition: transform .1s, background .2s, border-color .2s;
}
.btn:hover { border-color: var(--accent); background: #22355f; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, #2f7cf0, #4ea3ff); border-color: transparent; color: #fff; }
.btn-primary:hover { background: linear-gradient(135deg, #3d8cff, #6db5ff); }
.btn.big { font-size: 1.1rem; padding: 13px 26px; }
.btn.small { font-size: .85rem; padding: 6px 12px; }
.btn.ghost { background: transparent; }
.btn.good { background: #1c6b45; border-color: #2fae6d; }
.btn.danger { background: #6b1c26; border-color: #c43a4b; }
.btn.sel { border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(124, 240, 208, .35) inset; }
input, select { font: inherit; color: var(--text); background: #0c1428; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
input[type=range] { padding: 0; accent-color: var(--accent); width: 100%; }

/* ---------- Титул ---------- */
.title-screen { text-align: center; padding-top: 7vh; }
.title-screen h1 { font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 800; letter-spacing: .02em; background: linear-gradient(90deg, #9fd0ff, #fff, #7cf0d0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--muted); font-size: 1.2rem; margin-bottom: 2em; }
.title-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.logo-orbit { position: relative; width: 180px; height: 180px; margin: 0 auto 20px; }
.planet { position: absolute; inset: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8fd0ff, #2a6bd1 45%, #0b2453 75%); box-shadow: 0 0 60px rgba(78, 163, 255, .45); }
.ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(160, 200, 255, .4); }
.sat { position: absolute; left: 50%; top: 50%; font-size: 26px; transform-origin: 0 0; animation: orbit 8s linear infinite; }
@keyframes orbit { from { transform: rotate(0deg) translate(80px) rotate(0deg); } to { transform: rotate(360deg) translate(80px) rotate(-360deg); } }

/* ---------- Диалог ---------- */
.dialog { display: flex; gap: 16px; align-items: flex-start; margin: 14px 0; animation: fadein .3s ease; }
.avatar { flex: 0 0 96px; width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 24px rgba(78, 163, 255, .35); overflow: hidden; background: #0d1730; }
.avatar-svg { width: 100%; height: 100%; display: block; }
.bubble { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 4px var(--radius) var(--radius) var(--radius); padding: 14px 18px; min-height: 96px; }
.speaker { font-weight: 800; color: var(--accent); margin-bottom: 4px; }
.speaker span { font-weight: 400; color: var(--muted); font-size: .85rem; }
.speech { min-height: 3em; font-size: 1.05rem; }
.dialog-actions { text-align: right; margin-top: 10px; }
.intro { padding-top: 6vh; max-width: 760px; margin: 0 auto; }
.name-form label { display: block; margin-bottom: 6px; color: var(--muted); }
.name-form input { flex: 1; min-width: 180px; }

.hint { display: flex; gap: 10px; align-items: center; background: rgba(20, 40, 80, .75); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 8px 0; }
.mini-avatar { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; border: 1px solid var(--accent); }
.hint-text { font-size: .95rem; }

/* ---------- Роли ---------- */
.roles { text-align: center; padding-top: 3vh; }
.role-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 24px; text-align: left; }
.role-card { font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; transition: transform .15s, border-color .2s, box-shadow .2s; }
.role-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 40px rgba(78, 163, 255, .2); }
.role-icon { font-size: 3rem; }
.role-card ul { padding-left: 0; list-style: none; margin: 10px 0 0; color: var(--muted); }
.role-card li { padding: 3px 0; }

/* ---------- Меню ---------- */
.menu-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.menu-stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stars-big { color: var(--gold); font-weight: 800; font-size: 1.2rem; }
.cat { margin-top: 22px; }
.mission-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.mission-card { font: inherit; color: inherit; text-align: left; display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: transform .15s, border-color .2s; }
.mission-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.m-icon { font-size: 2.2rem; flex: 0 0 auto; }
.m-body { flex: 1; }
.m-body h4 { margin: 0 0 2px; color: var(--text); }
.m-body p { margin: 0; color: var(--muted); font-size: .88rem; }
.m-score { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stars { color: var(--gold); letter-spacing: 2px; }
.stars.huge { font-size: 2.4rem; }

/* ---------- Брифинг/миссия/итог ---------- */
.crumbs { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.brief-facts ul, .report { margin: 0; padding-left: 20px; }
.brief-facts li, .report li { margin: 4px 0; }
.brief-go { text-align: center; }
.controls-card { text-align: left; }
.mission-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
.mb-title { font-weight: 800; font-size: 1.25rem; }
.result { text-align: center; }
.result .card { text-align: left; }
.result-score { text-align: center !important; }
.score-num { font-size: 4rem; font-weight: 800; line-height: 1; }
.score-num span { font-size: 1.4rem; color: var(--muted); }
.result-talk { text-align: left; }

/* ---------- Игровые элементы ---------- */
.game-canvas { display: block; width: 100%; height: auto; background: #000; border-radius: 12px; border: 1px solid var(--line); touch-action: none; user-select: none; }
.stage-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 8px; }
.stage-title h3 { margin: 0; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { font-size: .8rem; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.step.on { border-color: var(--accent); color: var(--text); background: rgba(78, 163, 255, .15); }
.step.done { border-color: var(--good); color: var(--good); }
.choices { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.choice { font: inherit; color: inherit; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; text-align: left; flex: 1 1 200px; transition: border-color .2s; }
.choice:hover { border-color: var(--accent); }
.choice.sel { border-color: var(--accent-2); background: rgba(124, 240, 208, .1); }
.choice.right { border-color: var(--good); background: rgba(79, 224, 138, .12); }
.choice.wrong { border-color: var(--bad); background: rgba(255, 93, 108, .12); }
.choice b { display: block; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }
.meter { height: 12px; background: #0b1326; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.meter > i { display: block; height: 100%; background: var(--accent); transition: width .15s; }
.meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(79, 224, 138, .28); border-left: 1px solid var(--good); border-right: 1px solid var(--good); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
.ok { color: var(--good); }
.bad { color: var(--bad); }
.warn { color: var(--warn); }
table.data { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.data th, table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.data tr.pick { cursor: pointer; }
table.data tr.pick:hover td { background: rgba(78, 163, 255, .1); }
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--accent); padding: 10px 18px; border-radius: 10px; z-index: 50; animation: fadein .2s; max-width: 90vw; }
.overlay { position: absolute; inset: 0; background: rgba(3, 6, 15, .82); display: flex; align-items: center; justify-content: center; border-radius: 12px; z-index: 5; padding: 10px; }
.overlay .card { max-width: 560px; width: 100%; }
.canvas-wrap { position: relative; }

/* Сенсорные кнопки */
.touch-pad { display: none; justify-content: space-between; gap: 10px; margin-top: 10px; user-select: none; }
.touch-group { display: flex; gap: 6px; flex-wrap: nowrap; }
.touch-btn { width: 56px; height: 56px; font-size: 1.2rem; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); touch-action: none; }
.touch-btn.wide { width: auto; padding: 0 14px; font-size: .95rem; }
.touch-btn.on { background: var(--accent); }
@media (pointer: coarse) { .touch-pad { display: flex; } }

/* База */
.base-layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; }
@media (max-width: 900px) { .base-layout { grid-template-columns: 1fr; } }
.base-grid { display: grid; gap: 2px; background: #0a0f1e; padding: 2px; border-radius: 10px; border: 1px solid var(--line); }
.cell { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: clamp(.8rem, 2.4vw, 1.4rem); cursor: pointer; position: relative; }
.cell.t-R { background: linear-gradient(135deg, #b9b6ad, #8f8c84); }
.cell.t-p { background: #6f6c66; }
.cell.t-C { background: #1d2333; cursor: not-allowed; }
.cell.t-X { background: repeating-linear-gradient(45deg, #4e4b46, #4e4b46 4px, #3c3a36 4px, #3c3a36 8px); cursor: not-allowed; }
.cell:hover { outline: 2px solid var(--accent); z-index: 1; }
.cell.badplace { box-shadow: inset 0 0 0 2px var(--bad); }
.palette { display: flex; flex-direction: column; gap: 6px; }
.pal-item { font: inherit; color: inherit; display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; cursor: pointer; text-align: left; }
.pal-item.sel { border-color: var(--accent-2); background: rgba(124, 240, 208, .12); }
.checklist { list-style: none; padding: 0; margin: 0; font-size: .9rem; }
.checklist li { padding: 3px 0; }

/* ISRU */
.isru-machine { display: grid; grid-template-columns: 1.4fr 2fr 70px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
@media (max-width: 640px) { .isru-machine { grid-template-columns: 1fr; } }
.stock { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stock div { background: #0b1326; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stock b { display: block; font-size: 1.2rem; }

/* Ретранслятор */
.relay-table td.slot { text-align: center; cursor: pointer; min-width: 44px; font-size: .8rem; }
.relay-table td.vis { background: rgba(79, 224, 138, .15); }
.relay-table td.act { background: rgba(78, 163, 255, .35); font-weight: 800; }
.relay-wrap { overflow-x: auto; }

/* Провода */
.wires { display: flex; justify-content: space-between; gap: 30px; margin: 14px 0; }
.wire-col { display: flex; flex-direction: column; gap: 10px; }
.wire { width: 90px; height: 32px; border-radius: 8px; border: 2px solid #0008; cursor: pointer; }
.wire.done { opacity: .35; cursor: default; }
.wire.sel { outline: 3px solid #fff; }

@media (max-width: 600px) {
  .dialog { gap: 10px; }
  .avatar { flex-basis: 60px; width: 60px; height: 60px; }
  .bubble { min-height: 60px; padding: 10px 12px; }
  h2 { font-size: 1.35rem; }
  .score-num { font-size: 3rem; }
  .touch-btn { width: 46px; height: 50px; font-size: 1rem; }
  .touch-btn.wide { padding: 0 10px; font-size: .85rem; }
}

</style>

<script>
/* ===== js/core.js ===== */
'use strict';
/* ===== Общие утилиты, состояние, ассистентка, реестр миссий ===== */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const fmt = (v, d = 0) => Number(v).toFixed(d);

/** Детерминированный генератор случайных чисел */
function rng(seed) {
  let a = seed >>> 0;
  const f = () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (lo, hi) => lo + f() * (hi - lo);
  f.int = (lo, hi) => Math.floor(lo + f() * (hi - lo + 1));
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.gauss = () => { let u = 0, v = 0; while (!u) u = f(); while (!v) v = f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  return f;
}
const R = rng(Date.now() % 1e9);
function shuffle(arr, r = R) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/** Область жизни: всё, что зарегистрировано, снимается при dispose() */
class Scope {
  constructor() { this.fns = []; this.alive = true; this.keys = {}; this._keys = false; }
  on(target, evt, fn, opts) { target.addEventListener(evt, fn, opts); this.fns.push(() => target.removeEventListener(evt, fn, opts)); }
  raf(fn) {
    let last = performance.now(), id = 0, stopped = false;
    const step = (t) => {
      if (!this.alive || stopped) return;
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (fn(dt, t) === false) { stopped = true; return; }
      id = requestAnimationFrame(step);
    };
    id = requestAnimationFrame(step);
    const stop = () => { stopped = true; cancelAnimationFrame(id); };
    this.fns.push(stop);
    return stop;
  }
  timeout(fn, ms) { const id = setTimeout(() => this.alive && fn(), ms); this.fns.push(() => clearTimeout(id)); return id; }
  interval(fn, ms) { const id = setInterval(() => this.alive && fn(), ms); this.fns.push(() => clearInterval(id)); return id; }
  trackKeys() {
    if (this._keys) return this.keys;
    this._keys = true;
    const block = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
    this.on(window, 'keydown', (e) => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      this.keys[e.code] = true;
      if (block.includes(e.code)) e.preventDefault();
    });
    this.on(window, 'keyup', (e) => { this.keys[e.code] = false; });
    this.on(window, 'blur', () => { for (const k in this.keys) this.keys[k] = false; });
    return this.keys;
  }
  dispose() { this.alive = false; this.fns.forEach((f) => { try { f(); } catch (e) { /* noop */ } }); this.fns = []; }
}

/** Экранные кнопки для сенсорных устройств: эмулируют клавиши */
function touchControls(scope, groups) {
  const wrap = h('<div class="touch-pad"></div>');
  for (const g of groups) {
    const grp = h('<div class="touch-group"></div>');
    for (const b of g) {
      const btn = h(`<button class="touch-btn" type="button">${b.label}</button>`);
      if (b.wide) btn.classList.add('wide');
      const down = (e) => { e.preventDefault(); btn.classList.add('on'); window.dispatchEvent(new KeyboardEvent('keydown', { code: b.code, key: b.code })); };
      const up = (e) => { e.preventDefault(); if (!btn.classList.contains('on')) return; btn.classList.remove('on'); window.dispatchEvent(new KeyboardEvent('keyup', { code: b.code, key: b.code })); };
      scope.on(btn, 'pointerdown', down);
      scope.on(btn, 'pointerup', up);
      scope.on(btn, 'pointerleave', up);
      scope.on(btn, 'pointercancel', up);
      grp.appendChild(btn);
    }
    wrap.appendChild(grp);
  }
  return wrap;
}

/** Координаты указателя в системе координат canvas */
function canvasPoint(canvas, e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
}

/* ===== Сохранение ===== */
const Store = {
  key: 'space-missions-v1',
  data: { name: '', role: null, best: {} },
  load() { try { const s = JSON.parse(localStorage.getItem(this.key)); if (s) this.data = Object.assign(this.data, s); } catch (e) { /* noop */ } return this.data; },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* noop */ } },
  reset() { this.data = { name: '', role: null, best: {} }; try { localStorage.removeItem(this.key); } catch (e) { /* noop */ } },
};
const starsFor = (score) => (score >= 90 ? 3 : score >= 70 ? 2 : score >= 40 ? 1 : 0);
const starStr = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);

/* ===== Ассистентка ===== */
const ASSISTANT = { name: 'Эмили Картер', title: 'координатор миссий' };
const AVATAR_SVG = `
<svg viewBox="0 0 120 120" class="avatar-svg" aria-hidden="true">
  <defs>
    <radialGradient id="avbg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#2b4f8a"/><stop offset="1" stop-color="#0d1730"/></radialGradient>
    <linearGradient id="avhair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3420"/><stop offset="1" stop-color="#3a2014"/></linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#avbg)"/>
  <path d="M28 64 C24 30 44 18 60 18 C80 18 98 30 92 70 L92 96 L28 96 Z" fill="url(#avhair)"/>
  <path d="M22 120 C24 96 40 88 60 88 C80 88 96 96 98 120 Z" fill="#1d3f7a"/>
  <path d="M48 88 L60 104 L72 88 Z" fill="#e9eef7"/>
  <rect x="52" y="74" width="16" height="16" rx="6" fill="#e9b48f"/>
  <ellipse cx="60" cy="56" rx="21" ry="25" fill="#f2c4a0"/>
  <path d="M38 52 C40 30 58 28 66 30 C76 32 84 40 82 54 C76 42 62 38 50 42 C44 44 40 48 38 52 Z" fill="url(#avhair)"/>

/** Диалог с ассистенткой. lines: строки (можно HTML). Возвращает Promise, завершается после последней реплики */
function talk(container, lines, opts = {}) {
  return new Promise((resolve) => {
    const box = h(`
      <div class="dialog">
        <div class="avatar">${AVATAR_SVG}</div>
        <div class="bubble">
          <div class="speaker">${ASSISTANT.name} <span>· ${ASSISTANT.title}</span></div>
          <div class="speech"></div>
          <div class="dialog-actions"><button class="btn btn-primary next" type="button">Далее ▸</button></div>
        </div>
      </div>`);
    container.appendChild(box);
    const speech = $('.speech', box);
    const next = $('.next', box);
    let i = 0, typing = null, full = '';
    const show = () => {
      full = lines[i];
      const plain = full.replace(/<[^>]+>/g, '');
      let n = 0;
      speech.textContent = '';
      clearInterval(typing);
      typing = setInterval(() => {
        n += 2;
        if (n >= plain.length) { clearInterval(typing); typing = null; speech.innerHTML = full; return; }
        speech.textContent = plain.slice(0, n);
      }, 16);
      next.textContent = i === lines.length - 1 ? (opts.lastLabel || 'Понятно ✓') : 'Далее ▸';
    };
    const advance = () => {
      if (typing) { clearInterval(typing); typing = null; speech.innerHTML = full; return; }
      i++;
      if (i >= lines.length) {
        if (opts.keep) { next.remove(); } else { box.remove(); }
        resolve();
        return;
      }
      show();
    };
    next.addEventListener('click', advance);
    show();
  });
}

    c.width = innerWidth; c.height = innerHeight;

      x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.4 + 0.2, p: Math.random() * 6.28, s: 0.3 + Math.random() * 1.2,

  };
  requestAnimationFrame(draw);
})();

      const rf = clamp(40 + s.err * 0.5, 14, 160);
      // траектория
      const pts = [];
      for (let t = 0; t <= 1; t += 0.02) pts.push(bez([E[0] + 30, E[1] - 18], [400, 150], [600, 420], [M[0], M[1] + rf], t));
      for (let a = Math.PI / 2; a >= -Math.PI / 2; a -= 0.1) pts.push([M[0] + Math.cos(a) * rf, M[1] + Math.sin(a) * rf]);
      for (let t = 0; t <= 1; t += 0.02) pts.push(bez([M[0], M[1] - rf], [600, 100], [400, 370], [E[0] + 30, E[1] + 18], t));
      ctx.setLineDash([6, 6]); ctx.strokeStyle = s.done ? 'rgba(124,240,208,.9)' : 'rgba(124,240,208,.3)'; ctx.lineWidth = 2;
      ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); ctx.setLineDash([]);
      // Земля и Луна
      let g = ctx.createRadialGradient(E[0] - 10, E[1] - 10, 5, E[0], E[1], 34); g.addColorStop(0, '#9fd3ff'); g.addColorStop(1, '#1e5bb8');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(E[0], E[1], 32, 0, 7); ctx.fill();
      g = ctx.createRadialGradient(M[0] - 5, M[1] - 5, 2, M[0], M[1], 12); g.addColorStop(0, '#eee'); g.addColorStop(1, '#888');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(M[0], M[1], 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#cfe'; ctx.font = '14px "Exo 2"'; ctx.textAlign = 'center'; ctx.fillText('Земля', E[0], E[1] + 52); ctx.fillText('Луна', M[0], M[1] + 30);
      if (s.done) { const p = pts[Math.min(pts.length - 1, Math.floor(s.anim * (pts.length - 1)))]; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, 7); ctx.fill(); }
      // шкала
      ctx.fillStyle = 'rgba(0,8,20,.75)'; ctx.fillRect(250, 390, 460, 76);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px "Exo 2"'; ctx.fillText(`Δv: ${fmt(s.dv, 0)} / ${TARGET} м/с`, W / 2, 418);
      ctx.fillStyle = '#222'; ctx.fillRect(270, 430, 420, 14);
      ctx.fillStyle = s.burning ? '#ffb547' : '#4ea3ff'; ctx.fillRect(270, 430, clamp(s.dv / (TARGET + 400), 0, 1) * 420, 14);
      ctx.fillStyle = '#4fe08a'; ctx.fillRect(270 + (TARGET / (TARGET + 400)) * 420 - 1, 426, 3, 22);
      ctx.font = '13px "Exo 2"'; ctx.fillStyle = s.burning ? '#ffb547' : '#93a2c4';
      ctx.fillText(s.done ? `Двигатель выключен. Ошибка: ${s.err > 0 ? '+' : ''}${fmt(s.err, 0)} м/с` : s.burning ? 'ДВИГАТЕЛЬ РАБОТАЕТ — Пробел, чтобы выключить' : 'Пробел — включить двигатель', W / 2, 460);
    }

    /* ---------- 4. Вход в атмосферу и приводнение ---------- */
    function reentry() {
      root.innerHTML = '';
      const el = h(`<div>${header(3, 'Этап 4: вход в атмосферу и приводнение')}<canvas class="game-canvas" width="${W}" height="${H}"></canvas></div>`);
      root.appendChild(el);
      el.appendChild(touchControls(S, [[{ label: '▲', code: 'ArrowUp' }, { label: '▼', code: 'ArrowDown' }], [{ label: 'Парашюты', code: 'Space', wide: true }]]));
      api.hint('Капсула входит в атмосферу на скорости около 11 км/с. Держите угол входа в коридоре 5,5–7°: круче — перегрев и перегрузка, положе — капсула отскочит от атмосферы. Стрелки ▲/▼ — управление подъёмной силой.');
      const cv = $('canvas', el), ctx = cv.getContext('2d');
      const s = { g: 6.2, dg: 0, t: 0, inC: 0, n: 0, heat: 0, phase: 'entry', alt: 6000, chute: null, maxHeat: 0 };
      S.on(window, 'keydown', (e) => {
        if (e.code !== 'Space' || s.phase !== 'chute') return;
        s.chute = s.alt; s.phase = 'land';
      });
      S.raf((dt) => {
        s.t += dt;
        if (s.phase === 'entry') {
          s.dg += R.gauss() * 1.4 * dt; s.dg = clamp(s.dg, -0.7, 0.7);
          let c = 0; if (keys.ArrowUp) c -= 1; if (keys.ArrowDown) c += 1;
          s.g += (s.dg * 0.7 + c * 1.2) * dt;
          s.g = clamp(s.g, 3.5, 9);
          s.n++; if (s.g >= 5.5 && s.g <= 7) s.inC++;
          s.heat = clamp(s.heat + (s.g > 7 ? (s.g - 7) * 30 : -10) * dt, 0, 100); s.maxHeat = Math.max(s.maxHeat, s.heat);
          if (s.t > 25) { s.phase = 'chute'; api.hint('Плазма позади! Высота падает. Выпустите основные парашюты на высоте от 2,5 до 3,5 км — Пробел.'); }
        } else if (s.phase === 'chute') {
          s.alt -= 200 * dt;
          if (s.alt <= 600) { s.chute = 0; s.phase = 'land'; }
        } else if (s.phase === 'land') {
          s.alt -= (s.chute > 0 ? 40 : 300) * dt;
          if (s.alt <= 0) { s.alt = 0; s.phase = 'done'; finishEntry(); return false; }
        }
        drawEntry(ctx, s);
      });
      const finishEntry = () => {
        const corr = (s.inC / s.n) * 100;
        const chuteOk = s.chute >= 2500 && s.chute <= 3500;
        const chuteScore = s.chute === 0 ? 0 : chuteOk ? 100 : clamp(100 - Math.min(Math.abs(s.chute - 3000) - 500, 3000) / 15, 20, 90);
        const sc = corr * 0.65 + chuteScore * 0.25 + (100 - s.maxHeat) * 0.1;
        scores.push(sc);
        details.push(`Вход в атмосферу: в коридоре ${fmt(corr, 0)}% времени, макс. перегрев теплозащиты ${fmt(s.maxHeat, 0)}%`);
        details.push(s.chute === 0 ? '<span class="bad">Парашюты выпущены автоматикой слишком поздно — жёсткое приводнение</span>' : `Парашюты: на высоте ${fmt(s.chute / 1000, 2)} км ${chuteOk ? '✅' : '(вне оптимального окна)'}`);
        details.push('Приводнение в Тихом океане у берегов Сан-Диего. Экипаж поднят на борт корабля ВМС.');
        const total = scores.reduce((a, b) => a + b, 0) / 4;
        S.timeout(() => api.finish(total, details), 1600);
      };
    }
    function drawEntry(ctx, s) {
      if (s.phase === 'entry') {
        ctx.fillStyle = '#04081a'; ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, 1400, 900, W / 2, 1400, 1150); g.addColorStop(0, '#1d5fb4'); g.addColorStop(0.92, '#5aa0e8'); g.addColorStop(1, 'rgba(120,180,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W / 2, 1400, 1150, 0, 7); ctx.fill();
        ctx.save(); ctx.translate(W / 2 - 100, 220); ctx.rotate((s.g - 6.2) * 0.15 + 0.3);
        const pl = ctx.createRadialGradient(-30, 0, 5, -30, 0, 80 + s.heat);
        pl.addColorStop(0, 'rgba(255,240,200,.95)'); pl.addColorStop(0.5, 'rgba(255,120,40,.6)'); pl.addColorStop(1, 'rgba(255,50,0,0)');
        ctx.fillStyle = pl; ctx.beginPath(); ctx.arc(-30, 0, 80 + s.heat, 0, 7); ctx.fill();
        ctx.fillStyle = '#c8ccd4'; ctx.beginPath(); ctx.moveTo(-18, -30); ctx.lineTo(-18, 30); ctx.lineTo(30, 14); ctx.lineTo(30, -14); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#5a3a20'; ctx.fillRect(-22, -30, 6, 60);
        ctx.restore();
        // индикатор коридора
        const x0 = 640, y0 = 60, hh = 320;
        const Y = (g) => y0 + ((g - 3.5) / 5.5) * hh;
        ctx.fillStyle = 'rgba(0,8,20,.75)'; ctx.fillRect(x0 - 20, y0 - 40, 300, hh + 70);
        ctx.fillStyle = 'rgba(79,224,138,.25)'; ctx.fillRect(x0, Y(5.5), 60, Y(7) - Y(5.5));
        ctx.fillStyle = 'rgba(255,93,108,.18)'; ctx.fillRect(x0, Y(7), 60, Y(9) - Y(7));
        ctx.fillStyle = 'rgba(255,181,71,.18)'; ctx.fillRect(x0, y0, 60, Y(5.5) - y0);
        ctx.fillStyle = '#fff'; ctx.fillRect(x0 - 6, Y(s.g) - 2, 72, 4);
        ctx.font = '13px "Exo 2"'; ctx.textAlign = 'left';
        ctx.fillStyle = '#ffb547'; ctx.fillText('отскок', x0 + 70, Y(4.4));
        ctx.fillStyle = '#4fe08a'; ctx.fillText('коридор входа', x0 + 70, Y(6.3));
        ctx.fillStyle = '#ff5d6c'; ctx.fillText('перегрев', x0 + 70, Y(8));
        ctx.fillStyle = '#fff'; ctx.font = '15px "Exo 2"';
        ctx.fillText(`Угол входа: ${fmt(s.g, 2)}°`, x0, y0 - 14);
        ctx.fillText(`Теплозащита: ${fmt(s.heat, 0)}%`, x0, y0 + hh + 24);
        ctx.fillText(`T+${fmt(s.t, 0)} / 25 c`, 30, 30);
      } else {
        const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5aa8ef'); g.addColorStop(1, '#bfe2ff');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        const sea = 680 - (s.alt / 6000) * 300;
        ctx.fillStyle = '#1c5f9a'; ctx.fillRect(0, Math.min(H, sea), W, H);
        const cy = Math.min(sea - 30, 240);
        if (s.chute > 0 && s.phase !== 'chute') {
          ctx.fillStyle = '#ff7a2a';
          [-60, 0, 60].forEach((dx) => { ctx.beginPath(); ctx.arc(W / 2 + dx, cy - 110, 40, Math.PI, 0); ctx.fill(); ctx.strokeStyle = '#eee'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(W / 2 + dx - 40, cy - 110); ctx.lineTo(W / 2, cy - 20); ctx.moveTo(W / 2 + dx + 40, cy - 110); ctx.lineTo(W / 2, cy - 20); ctx.stroke(); });
        }
        ctx.fillStyle = '#c8ccd4'; ctx.beginPath(); ctx.moveTo(W / 2 - 30, cy); ctx.lineTo(W / 2 + 30, cy); ctx.lineTo(W / 2 + 14, cy - 34); ctx.lineTo(W / 2 - 14, cy - 34); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(0,8,20,.7)'; ctx.fillRect(20, 20, 320, 60);
        ctx.fillStyle = '#fff'; ctx.font = '18px "Exo 2"'; ctx.textAlign = 'left';
        ctx.fillText(`Высота: ${fmt(s.alt / 1000, 2)} км`, 34, 46);
        ctx.font = '13px "Exo 2"'; ctx.fillStyle = s.alt <= 3500 && s.alt >= 2500 ? '#4fe08a' : '#93a2c4';
        ctx.fillText(s.phase === 'chute' ? 'Окно выпуска парашютов: 2,5–3,5 км' : s.alt > 0 ? 'Спуск на парашютах' : 'Приводнение!', 34, 68);
        if (s.phase === 'done') { ctx.fillStyle = '#fff'; ctx.font = 'bold 28px "Exo 2"'; ctx.textAlign = 'center'; ctx.fillText('Приводнение у Сан-Диего!', W / 2, 120); }
      }
    }

    launch();
  }

  Missions.register({
    id: 'testflight', role: 'pilot', cat: 'moon', icon: '🚀', title: 'Испытательный полёт',
    short: 'Проверка ракеты, корабля и жизнеобеспечения с экипажем на борту',
    facts: [
      'Artemis II: четыре астронавта стартовали 1 апреля 2026 года, облетели Луну 6 апреля и приводнились у Сан-Диего 10 апреля.',
      'Это первый пилотируемый полёт к Луне за более чем 50 лет, и экипаж улетел дальше от Земли, чем кто-либо до них.',
      'Траектория свободного возврата позволяет кораблю облететь Луну и вернуться к Земле без дополнительных крупных манёвров.',
      'При возвращении от Луны капсула входит в атмосферу на скорости около 11 км/с — теплозащита нагревается почти до 2800 °C.',
    ],
    briefing: [
      'Пилот, вы назначены командиром испытательного полёта к Луне — по образцу миссии Artemis II.',
      'Задача испытаний — проверить в деле ракету, корабль и систему жизнеобеспечения с людьми на борту. Полёт пройдёт в четыре этапа.',
      '<b>Старт:</b> проведите ракету через зону максимального скоростного напора. <b>Жизнеобеспечение:</b> держите воздух в кабине в норме. <b>Разгон:</b> выдайте точный импульс к Луне. <b>Возвращение:</b> войдите в атмосферу в узком коридоре и выпустите парашюты.',
      'Экипаж доверяет вам. Поехали!',
    ],
    controls: '<b>Стрелки ▲/▼</b> — тяга и угол входа, <b>Пробел</b> — отделение ступени, двигатель, парашюты. Ползунки — мышью.',
    start,
  });
})();

/* ===== js/embed.js ===== */
'use strict';
/* Встраивание отдельных миссий в любой проект.
 *
 *   const game = SpaceMissions.mount('rover', document.getElementById('box'), {
 *     briefing: true,                       // показать брифинг ассистентки перед стартом
 *     onFinish: ({ id, score, stars, details }) => { ... },  // свой обработчик результата
 *   });
 *   game.restart();   // начать заново
 *   game.destroy();   // остановить и очистить контейнер
 *
 * Нужны: css/style.css, js/core.js, js/moon-art.js (для Луны), файл миссии и этот файл.
 */
(function () {
  function mount(id, container, opts = {}) {
    const m = Missions.get(id);
    if (!m) throw new Error(`Миссия «${id}» не найдена. Доступны: ${Missions.list.map((x) => x.id).join(', ')}`);
    let scope = null;

    const clear = () => { if (scope) { scope.dispose(); scope = null; } container.innerHTML = ''; };

    async function briefing() {
      clear();
      const el = h(`<section class="briefing screen">
        <h2>${m.icon} ${m.title}</h2>
        <div class="brief-talk"></div>
        <div class="brief-facts card"><h4>Справка</h4><ul>${m.facts.map((f) => `<li>${f}</li>`).join('')}</ul></div>
        <div class="brief-go hidden"><div class="card controls-card"><h4>Управление</h4><p>${m.controls}</p></div>
          <button class="btn btn-primary big" type="button">🚀 Начать миссию</button></div>
      </section>`);
      container.appendChild(el);
      $('.brief-go button', el).addEventListener('click', play);
      await talk($('.brief-talk', el), m.briefing, { keep: true, lastLabel: 'Всё ясно' });
      if (el.isConnected) $('.brief-go', el).classList.remove('hidden');
    }

    function play() {
      clear();
      scope = new Scope();
      const el = h(`<section class="mission screen">
        <div class="mission-bar"><div class="mb-title">${m.icon} ${m.title}</div></div>
        <div class="mission-hint"></div><div class="mission-root"></div></section>`);
      container.appendChild(el);
      const hintEl = $('.mission-hint', el);
      let finished = false;
      const api = {
        scope,
        hint(text) { hintEl.innerHTML = ''; if (text) hintEl.appendChild(hintBox(text)); },
        finish(score, details = []) {
          if (finished) return;
          finished = true;
          score = Math.round(clamp(score, 0, 100));
          const res = { id: m.id, score, stars: starsFor(score), details };
          if (opts.onFinish) { clear(); opts.onFinish(res); } else result(res);
        },
      };
      m.start($('.mission-root', el), api);
    }

    function result({ score, stars, details }) {
      clear();
      const el = h(`<section class="result screen">
        <h2>${m.icon} ${m.title}: ${score >= 40 ? 'миссия выполнена' : 'миссия провалена'}</h2>
        <div class="result-score card"><div class="score-num">${score}<span>/100</span></div><div class="stars huge">${starStr(stars)}</div></div>
        ${details.length ? `<div class="card"><h4>Отчёт о миссии</h4><ul class="report">${details.map((x) => `<li>${x}</li>`).join('')}</ul></div>` : ''}
        <div class="row center"><button class="btn btn-primary" type="button">↻ Пройти ещё раз</button></div></section>`);
      container.appendChild(el);
      $('button', el).addEventListener('click', start);
    }

    const start = () => (opts.briefing === false ? play() : briefing());
    start();
    return { restart: start, destroy: clear };
  }

  window.SpaceMissions = {
    mount,
    list: () => Missions.list.map(({ id, title, role, cat, icon, short }) => ({ id, title, role, cat, icon, short })),
  };
})();

SpaceMissions.mount('testflight', document.getElementById('app'));
</script>
